.preview-actions{max-width:900px;margin:20px auto;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.quote-paper{background:var(--surface);color:var(--ink);max-width:900px;margin:0 auto 40px;padding:38px;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);transition:all .3s ease}.qhead{display:flex;justify-content:space-between;border-bottom:3px solid var(--blue);padding-bottom:18px}.qbrand h1{color:var(--blue);margin:0}.qbrand p{margin:5px 0;font-size:13px;color:var(--muted)}.qmeta{text-align:right}.qmeta strong{font-size:20px}.customer{margin:24px 0;padding:14px;background:var(--surface-soft);border:1px solid var(--line);border-radius:10px}.qtable{width:100%;border-collapse:collapse}.qtable th,.qtable td{padding:9px;border:1px solid var(--line);text-align:left}.qtable th{background:var(--blue);color:white}.num{text-align:right!important}.totals{margin:20px 0 20px auto;width:330px}.totals div{display:flex;justify-content:space-between;padding:6px;color:var(--ink)}.totals .grand{font-size:18px;font-weight:800;border-top:2px solid var(--blue)}.terms{white-space:pre-line;font-size:12px;color:var(--muted)}.signature{margin-top:50px;text-align:right}.signature div{display:inline-block;border-top:1px solid var(--line);padding-top:6px;width:190px;color:var(--ink)}
